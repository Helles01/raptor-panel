version: "2"
sql:
  - engine: "mysql"
    # The tables of the reference panel (the baseline) and Raptor's own additive migrations.
    schema:
      - "internal/db/schema"
      - "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "dbq"
        out: "internal/db/dbq"
        emit_interface: true
